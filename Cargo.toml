[package]
name = "crabuv"
description = "A multi-platform event loop library 🎡"
authors = ["Alex Alikiotis <alexalikiotis5@gmail.com>"]
version = "0.1.3"
repository = "https://gitlab.com/aalykiot/crabuv"
license = "MIT"
readme = "README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
rayon = "1.11.0"
downcast-rs = { version = "2.0.2", default-features = false }
mio = { version = "1.0.4", features = ["os-poll", "net"] }
notify = "8.2.0"
slotmap = "1.1.1"
rand = "0.10.1"

[dependencies.signal-hook]
version = "0.3.18"
default-features = false
features = ["channel"]

[target.'cfg(unix)'.dependencies.signal-hook]
version = "0.3.18"
default-features = false
features = ["channel", "iterator"]

[target.'cfg(unix)'.dependencies]
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.0"
